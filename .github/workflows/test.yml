name: Tests
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by deploy-pages.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
